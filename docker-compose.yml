services:
  lista-conferencia:
    build: .
    image: lista-conferencia
    pull_policy: never
    restart: always
    container_name: lista-conferencia
    environment:
      - SERVER_PORT=8087
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_DOMAIN=conferencia.igrejaamareservir.com
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.conferencia-amareservir.entrypoints=https"
      - "traefik.http.routers.conferencia-amareservir.rule=Host(`conferencia.igrejaamareservir.com`)"
      - "traefik.http.routers.conferencia-amareservir.tls=true"
      - "traefik.http.services.conferencia-amareservir.loadbalancer.server.port=8087"
      - "traefik.docker.network=app-network"
    deploy:
      resources:
        limits:
          memory: 300M

networks:
  app-network:
    external: true
